<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parteneri iEL – Bază de Date</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Poppins:ital@1&display=swap" rel="stylesheet">
<style>
  :root {
    /* iEL brand palette – coral pink + turquoise */
    --orange:     #fe6167;   /* coral pink – primary accent */
    --orange-lt:  #fff0f0;   /* very light pink tint */
    --orange-md:  #fdbfc1;   /* medium pink tint */
    --navy:       #0fb8c2;   /* turquoise – header bg */
    --navy-lt:    #0da4ad;   /* slightly deeper turquoise */
    --white:      #FFFFFF;
    --bg:         #f7fcfc;   /* very light cyan-tinted bg */
    --surface:    #FFFFFF;
    --border:     #d6eef0;
    --muted:      #6b9096;
    --ink:        #1c2b2c;   /* near-black for all body text */
    --shadow:     rgba(15,184,194,0.12);
    --success:    #2E7D52;

    /* category badge colors */
    --c-liceu:    #e0f5f8; --c-liceu-t: #0a7a8e;
    --c-ong:      #e6f6ee; --c-ong-t:   #1b6b42;
    --c-centru:   #fff0f0; --c-centru-t:#b53040;
    --c-media:    #fff4e0; --c-media-t: #8a5200;
    --c-inspect:  #ffe8ea; --c-inspect-t:#c0172a;
    --c-partner:  #eafafb; --c-partner-t:#0a6a7a;
    --c-scoala:   #f0fde8; --c-scoala-t:#3a7a1b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; font-size: 14px; }

  /* ── HEADER ── */
  header {
    background: var(--navy);
    padding: 0 40px;
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
    position: sticky; top: 0; z-index: 100;
    height: 64px;
    border-bottom: 3px solid var(--orange);
  }
  .logo-area { display: flex; align-items: center; gap: 14px; }
  .logo-pill {
    background: var(--orange); color: white;
    font-weight: 700; font-size: 13px; letter-spacing: 0.5px;
    padding: 5px 12px; border-radius: 6px;
  }
  .logo-text { color: white; font-weight: 600; font-size: 17px; letter-spacing: -0.2px; }
  .logo-text span { color: var(--orange); }

  .header-stats { display: flex; gap: 24px; }
  .stat { text-align: center; }
  .stat-number { font-weight: 700; font-size: 22px; line-height: 1; color: white; }
  .stat-label { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-top: 1px; }

  /* ── TOOLBAR ── */
  .toolbar {
    background: white; border-bottom: 1px solid var(--border);
    padding: 10px 40px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  .search-wrap { position: relative; flex: 1; min-width: 200px; }
  .search-wrap input {
    width: 100%; padding: 8px 14px 8px 36px;
    border: 1.5px solid var(--border); border-radius: 8px;
    font-family: 'Poppins', sans-serif; font-size: 13px; color: var(--ink);
    background: var(--bg); outline: none; transition: border-color 0.2s;
  }
  .search-wrap input:focus { border-color: var(--orange); background: white; }
  .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; }

  .filter-tabs { display: flex; gap: 5px; flex-wrap: wrap; }
  .tab {
    padding: 6px 13px; border-radius: 20px; border: 1.5px solid var(--border);
    background: white; font-family: 'Poppins', sans-serif; font-size: 12px; font-weight: 500;
    cursor: pointer; transition: all 0.15s; color: var(--muted); white-space: nowrap;
  }
  .tab:hover { border-color: var(--orange); color: var(--orange); }
  .tab.active { background: var(--orange); color: white; border-color: var(--orange); font-weight: 600; }


  .btn-add {
    padding: 8px 18px; background: var(--orange); color: white; border: none;
    border-radius: 8px; font-family: 'Poppins', sans-serif; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: opacity 0.15s; white-space: nowrap; letter-spacing: 0.2px;
  }
  .btn-add:hover { opacity: 0.88; }

  /* ── MAIN LAYOUT ── */
  .main { display: flex; height: calc(100vh - 115px); overflow: hidden; }

  .table-panel { flex: 1; overflow-y: auto; padding: 18px 40px; transition: flex 0.3s ease; }
  .table-panel.with-detail { flex: 0 0 54%; }

  table { width: 100%; border-collapse: separate; border-spacing: 0 5px; }
  thead th {
    font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--muted); padding: 4px 14px; text-align: left;
    cursor: pointer; user-select: none; white-space: nowrap;
  }
  thead th:hover { color: var(--orange); }
  thead th.sorted { color: var(--orange); }

  tbody tr {
    background: white; cursor: pointer;
    transition: all 0.15s; animation: rowIn 0.18s ease both;
    border-radius: 10px;
  }
  @keyframes rowIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  tbody tr:hover { box-shadow: 0 3px 14px var(--shadow); transform: translateY(-1px); }
  tbody tr.selected { box-shadow: 0 3px 16px var(--shadow); outline: 2px solid var(--orange); outline-offset: -2px; }

  tbody td { padding: 12px 14px; vertical-align: middle; }
  tbody td:first-child { border-radius: 10px 0 0 10px; padding-left: 18px; }
  tbody td:last-child { border-radius: 0 10px 10px 0; padding-right: 18px; }

  .partner-name { font-weight: 600; font-size: 13.5px; line-height: 1.3; color: var(--ink); }
  .partner-name small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; margin-top: 1px; }

  .cat-badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .cat-liceu    { background: var(--c-liceu);   color: var(--c-liceu-t); }
  .cat-ong      { background: var(--c-ong);     color: var(--c-ong-t); }
  .cat-centru   { background: var(--c-centru);  color: var(--c-centru-t); }
  .cat-media    { background: var(--c-media);   color: var(--c-media-t); }
  .cat-inspector{ background: var(--c-inspect); color: var(--c-inspect-t); }
  .cat-partener { background: var(--c-partner); color: var(--c-partner-t); }
  .cat-scoala   { background: var(--c-scoala);  color: var(--c-scoala-t); }

  .contact-mini { font-size: 12px; color: var(--muted); max-width: 200px; }
  .contact-mini .cm-name { font-weight: 600; color: var(--ink); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .contact-mini .cm-role { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .contact-mini .cm-rel { font-size: 11px; color: var(--navy); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* address / city chip */
  .city-chip { display: inline-block; font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .city-chip::before { content: '📍'; font-size: 10px; margin-right: 2px; }

  /* contract checkbox */
  .checkbox-row { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .checkbox-row input[type=checkbox] { appearance: none; width: 17px; height: 17px; border: 2px solid var(--border); border-radius: 4px; background: var(--bg); cursor: pointer; flex-shrink: 0; transition: all 0.15s; position: relative; }
  .checkbox-row input[type=checkbox]:checked { background: var(--orange); border-color: var(--orange); }
  .checkbox-row input[type=checkbox]:checked::after { content: '✓'; position: absolute; color: white; font-size: 11px; font-weight: 700; top: 50%; left: 50%; transform: translate(-50%, -50%); }
  .checkbox-row span { font-size: 13px; font-weight: 500; color: var(--ink); }
  .contract-signed { color: var(--orange); font-weight: 600; }

  .no-results { text-align: center; padding: 48px; color: var(--muted); font-style: italic; }

  /* ── DETAIL PANEL ── */
  .detail-panel {
    width: 0; overflow: hidden; background: white;
    border-left: 1px solid var(--border); transition: width 0.3s ease; display: flex; flex-direction: column;
  }
  .detail-panel.open { width: 46%; min-width: 420px; }
  .detail-inner { overflow-y: auto; flex: 1; padding: 24px 28px 32px; }

  .detail-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 18px; gap: 12px;
    padding-bottom: 16px; border-bottom: 2px solid var(--orange-lt);
  }
  .detail-title { font-weight: 700; font-size: 17px; line-height: 1.25; flex: 1; color: var(--ink); }
  .detail-cat { margin-top: 5px; }
  .btn-close { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--muted); padding: 0; flex-shrink: 0; }
  .btn-close:hover { color: var(--orange); }

  .section { margin-bottom: 18px; }
  .section-title {
    font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
    margin-bottom: 10px;
    padding-bottom: 5px; border-bottom: 1.5px solid var(--border);
    display: flex; align-items: center; gap: 6px;
  }
  .section-title::before { content: ''; display: block; width: 3px; height: 12px; border-radius: 2px; }

  /* Section colour variants */
  .section-info .section-title { color: #0a7a8e; border-color: #d0f0f5; }
  .section-info .section-title::before { background: #0fb8c2; }
  .section-info { background: #f5fdfe; border-radius: 10px; padding: 14px 14px 4px; margin-bottom: 18px; border: 1px solid #d6eef0; }

  .section-contacts .section-title { color: #6b3fa0; border-color: #e8d8f8; }
  .section-contacts .section-title::before { background: #9b59d0; }
  .section-contacts { background: #faf5ff; border-radius: 10px; padding: 14px 14px 4px; margin-bottom: 18px; border: 1px solid #e8d8f8; }
  .section-contacts .contact-card { background: white; border-color: #e8d8f8; border-left-color: #9b59d0; }
  .section-contacts .btn-add-contact { border-color: #d4b0f0; color: #6b3fa0; }
  .section-contacts .btn-add-contact:hover { border-color: #9b59d0; background: #f5eeff; }
  .section-contacts .cc-label { color: #6b3fa0; }

  .section-notes .section-title { color: #8a5200; border-color: #fde8b0; }
  .section-notes .section-title::before { background: #f0a500; }
  .section-notes { background: #fffbf0; border-radius: 10px; padding: 14px 14px 14px; margin-bottom: 18px; border: 1px solid #fde8b0; }

  .edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .edit-grid .full { grid-column: 1/-1; }
  .fg { display: flex; flex-direction: column; gap: 4px; }
  .fg label { font-size: 10px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: var(--muted); }
  .fi {
    padding: 8px 11px; border: 1.5px solid var(--border); border-radius: 7px;
    font-family: 'Poppins', sans-serif; font-size: 13px; color: var(--ink);
    background: var(--bg); outline: none; transition: border-color 0.15s, background 0.15s; width: 100%;
  }
  .fi:focus { border-color: var(--orange); background: white; }
  select.fi { cursor: pointer; }
  textarea.fi { resize: vertical; min-height: 80px; }
  .fi.notes-field { background: var(--orange-lt); border-color: var(--orange-md); }
  .fi.notes-field:focus { border-color: var(--orange); background: white; }

  /* CONTACTS */
  .contact-card {
    background: var(--bg); border: 1.5px solid var(--border);
    border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
    border-left: 3px solid var(--orange);
  }
  .cc-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .cc-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--orange); }
  .btn-rm { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; transition: color 0.15s; }
  .btn-rm:hover { color: var(--orange); }
  .cc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .cc-grid .full { grid-column: 1/-1; }

  .btn-add-contact {
    width: 100%; margin-top: 6px; background: none;
    border: 1.5px dashed var(--orange-md); border-radius: 8px; padding: 8px;
    font-size: 12px; font-weight: 500; cursor: pointer;
    color: var(--orange); transition: all 0.15s; font-family: 'Poppins', sans-serif;
  }
  .btn-add-contact:hover { border-color: var(--orange); background: var(--orange-lt); }

  .action-row {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border);
  }
  .btn-save {
    padding: 9px 22px; background: var(--orange); color: white; border: none;
    border-radius: 8px; font-family: 'Poppins', sans-serif; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: opacity 0.15s;
  }
  .btn-save:hover { opacity: 0.88; }
  .btn-delete {
    padding: 8px 16px; background: none; color: var(--muted); border: 1.5px solid var(--border);
    border-radius: 8px; font-family: 'Poppins', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.15s;
  }
  .btn-delete:hover { color: #c0392b; border-color: #c0392b; }
  .flash { font-size: 12px; color: var(--success); font-weight: 600; display: none; }
  .flash.show { display: inline; }

  /* ── MODAL ── */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(27,42,74,0.45); z-index: 200; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal {
    background: white; border-radius: 14px; padding: 28px 30px;
    width: 560px; max-width: 95vw; max-height: 88vh; overflow-y: auto;
    animation: mIn 0.2s ease; box-shadow: 0 20px 60px rgba(27,42,74,0.2);
  }
  @keyframes mIn { from { opacity: 0; transform: scale(0.96) translateY(10px); } to { opacity: 1; transform: none; } }
  .modal-header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .modal-header h2 { font-size: 19px; font-weight: 700; color: var(--ink); }
  .modal-header .badge { background: var(--orange); color: white; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; }
  .mg { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
  .mg .full { grid-column: 1/-1; }
  .mg .section-divider { grid-column: 1/-1; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--orange); padding-top: 6px; border-top: 1.5px solid var(--orange-lt); }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
  .btn-cancel {
    padding: 9px 18px; background: none; border: 1.5px solid var(--border);
    border-radius: 8px; font-family: 'Poppins', sans-serif; font-size: 13px; cursor: pointer; color: var(--muted);
  }
  .btn-cancel:hover { border-color: var(--ink); color: var(--ink); }

  .sync-status {
    display: none; font-size: 12px; font-weight: 500; padding: 4px 10px;
    border-radius: 20px; white-space: nowrap;
  }
  .sync-status.loading { background: rgba(255,255,255,0.15); color: white; }
  .sync-status.saving  { background: rgba(255,255,255,0.15); color: white; }
  .sync-status.saved   { background: rgba(255,255,255,0.2); color: white; }
  .sync-status.error   { background: #fe6167; color: white; }


  /* ── STAR RATING ── */
  .star-rating { display: inline-flex; gap: 2px; }
  .star-rating .star {
    cursor: pointer; font-size: 16px; line-height: 1;
    color: #d6eef0; transition: color 0.1s;
    user-select: none;
  }
  .star-rating .star.on { color: #f0a500; }
  .star-rating .star:hover,
  .star-rating:hover .star.on { color: #f0a500; }
  .star-rating .star:hover ~ .star { color: #d6eef0 !important; }
  .star-col { white-space: nowrap; }


  /* ── SUBCATEGORY SUB-TABS ── */
  .subtab-bar {
    background: white; border-bottom: 1px solid var(--border);
    padding: 6px 40px; display: flex; gap: 5px; flex-wrap: wrap;
    animation: rowIn 0.15s ease both;
  }
  .subtab {
    padding: 4px 12px; border-radius: 20px; border: 1.5px solid var(--border);
    background: white; font-family: 'Poppins', sans-serif; font-size: 11px; font-weight: 500;
    cursor: pointer; transition: all 0.15s; color: var(--muted); white-space: nowrap;
  }
  .subtab:hover { border-color: var(--navy); color: var(--navy); }
  .subtab.active { background: var(--navy); color: white; border-color: var(--navy); font-weight: 600; }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--orange-md); }
</style>
</head>
<body>

<header>
  <div class="logo-area">
    <div class="logo-pill">iEL</div>
    <div class="logo-text">Parteneri <span>&amp;</span> Contacte</div>
  </div>
  <div class="header-stats">
    <div class="stat"><div class="stat-number" id="totalCount">0</div><div class="stat-label">Total</div></div>
    <div class="stat"><div class="stat-number" id="liceeCount">0</div><div class="stat-label">Licee</div></div>
    <div class="stat"><div class="stat-number" id="ongCount">0</div><div class="stat-label">ONG / Parteneri</div></div>
    <span class="sync-status" id="syncStatus"></span>
  </div>
</header>

<div class="toolbar">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Caută după nume, email, telefon, note, context…">
  </div>
  <div class="filter-tabs" id="filterTabs">
    <!-- rendered dynamically by renderFilterTabs() -->
  </div>
  <button class="btn-add" onclick="openAddModal()">+ Adaugă</button>
</div>

<div id="subtabBar" style="display:none"></div>
<div class="main">
  <div class="table-panel" id="tablePanel">
    <table>
      <thead>
        <tr>
          <th onclick="sortBy('name')" id="th-name">Instituție</th>
          <th onclick="sortBy('category')" id="th-category">Tip</th>
          <th>Contact principal</th>
          <th>Email</th>
          <th>Rating</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div id="noResults" class="no-results" style="display:none">Niciun rezultat găsit.</div>
  </div>

  <div class="detail-panel" id="detailPanel">
    <div class="detail-inner" id="detailInner"></div>
  </div>
</div>

<!-- ADD MODAL -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-header">
      <h2>Adaugă partener nou</h2>
      <span class="badge">iEL</span>
    </div>
    <div class="mg">
      <div class="fg full"><label>Nume instituție *</label><input class="fi" id="f-name" placeholder="ex: Colegiul Național…"></div>
      <div class="fg">
        <label>Categorie</label>
        <select class="fi" id="f-category"></select>
      </div>
      <div class="fg"><label>Website</label><input class="fi" id="f-website" placeholder="exemplu.ro"></div>
      <div class="fg"><label>Email principal</label><input class="fi" id="f-email" type="email" placeholder="office@..."></div>
      <div class="fg"><label>Telefon</label><input class="fi" id="f-phone" placeholder="0268 000 000"></div>
      <div class="fg"><label>Adresă / Oraș</label><input class="fi" id="f-address" placeholder="ex: Brașov"></div>
      <div class="fg full"><label>Context colaborare iEL</label><textarea class="fi" id="f-context" style="min-height:60px" placeholder="ex: Human Library 2024, Erasmus+ proiect…"></textarea></div>
      <div class="fg full">
        <label class="checkbox-row">
          <input type="checkbox" id="f-contract">
          <span>Contract de parteneriat semnat</span>
        </label>
      </div>

      <div class="section-divider">Persoană de contact</div>
      <div class="fg"><label>Nume</label><input class="fi" id="f-cname" placeholder="Prenume Nume"></div>
      <div class="fg"><label>Rol</label><input class="fi" id="f-crole" placeholder="director, profă…"></div>
      <div class="fg"><label>Telefon</label><input class="fi" id="f-cphone" placeholder="+40 7xx xxx xxx"></div>
      <div class="fg"><label>Email</label><input class="fi" id="f-cemail" type="email" placeholder="persoana@..."></div>
      <div class="fg full"><label>Relație cu iEL (cine din echipă a comunicat)</label><input class="fi" id="f-crel" placeholder="ex: Vera, Vlad, Tim…"></div>

      <div class="section-divider">Note</div>
      <div class="fg full"><textarea class="fi notes-field" id="f-notes" style="min-height:65px" placeholder="Observații, follow-up-uri…"></textarea></div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Anulează</button>
      <button class="btn-save" onclick="saveNewPartner()">Salvează partenerul</button>
    </div>
  </div>
</div>

<script>
function norm(s) {
  if (!s) return '';
  var map = {};
  map['\u015f']='s'; map['\u015e']='s';
  map['\u0163']='t'; map['\u0162']='t';
  map['\u0219']='s'; map['\u0218']='s';
  map['\u021b']='t'; map['\u021a']='t';
  map['\u0103']='a'; map['\u0102']='a';
  map['\u00e2']='a'; map['\u00c2']='a';
  map['\u00ee']='i'; map['\u00ce']='i';
  return s.toLowerCase().split('').map(function(c){ return map[c]||c; }).join('');
}
const DEFAULT_CATS = ['Liceu','Școală','Centru','ONG','Partener','Media','Instituție Publică'];
const CAT_COLORS = {
  Liceu:      { bg:'#e0f5f8', t:'#0a7a8e' },
  ONG:        { bg:'#e6f6ee', t:'#1b6b42' },
  Centru:     { bg:'#fff0f0', t:'#b53040' },
  Media:      { bg:'#fff4e0', t:'#8a5200' },
  'Instituție Publică':{ bg:'#ffe8ea', t:'#c0172a' },
  Partener:   { bg:'#eafafb', t:'#0a6a7a' },
  'Școală':   { bg:'#f0fde8', t:'#3a7a1b' },
};
const PALETTE = [
  { bg:'#f0e8ff', t:'#5a1fa0' },{ bg:'#fde8ff', t:'#8a0a8e' },
  { bg:'#e8f0ff', t:'#1a3a9a' },{ bg:'#fff8e0', t:'#7a5a00' },
  { bg:'#ffe8f5', t:'#9a0a5a' },{ bg:'#e8ffe8', t:'#1a6a2a' },
];
let paletteIdx = 0;

function getCats() {
  const custom = partners.filter(p=>p&&p.category).map(p=>p.category).filter(c=>!DEFAULT_CATS.includes(c));
  return [...DEFAULT_CATS, ...[...new Set(custom)]];
}

function getCatStyle(cat) {
  if (CAT_COLORS[cat]) return CAT_COLORS[cat];
  if (!CAT_COLORS[cat]) {
    // assign a stable color based on first time seen
    const allCustom = [...new Set(partners.map(p=>p.category).filter(c=>!DEFAULT_CATS.includes(c)))];
    const idx = allCustom.indexOf(cat) % PALETTE.length;
    return PALETTE[idx >= 0 ? idx : 0];
  }
}

function getCatClass(cat) {
  // Keep class-based for known cats, inline style for custom
  return 'cat-' + ({Liceu:'liceu',ONG:'ong',Centru:'centru',Media:'media','Instituție Publică':'inspector',Partener:'partener','Școală':'scoala'}[cat]||'custom');
}

function catBadge(cat) {
  const known = {Liceu:'liceu',ONG:'ong',Centru:'centru',Media:'media','Instituție Publică':'inspector',Partener:'partener','Școală':'scoala'};
  if (known[cat]) return `<span class="cat-badge cat-${known[cat]}">${esc(cat)}</span>`;
  const s = getCatStyle(cat);
  return `<span class="cat-badge" style="background:${s.bg};color:${s.t}">${esc(cat)}</span>`;
}

function renderFilterTabs() {
  const cats = getCats();
  const tabsEl = document.getElementById('filterTabs');
  tabsEl.innerHTML = `<button class="tab ${filter==='all'?'active':''}" data-filter="all">Toți</button>`
    + cats.map(c => `<button class="tab ${filter===c?'active':''}" data-filter="${esc(c)}">${esc(c==='Liceu'?'Licee':c==='ONG'?'ONG-uri':c==='Centru'?'Centre':c==='Școală'?'Școli':c==='Partener'?'Parteneri':c)}</button>`).join('')
;
  tabsEl.querySelectorAll('.tab').forEach(t => t.addEventListener('click', ()=>{
    filter = t.dataset.filter; subfilter = 'all'; renderFilterTabs(); render();
  }));
}

function promptAddCategory() {
  const name = prompt('Nume categorie nouă:');
  if (!name || !name.trim()) return;
  const trimmed = name.trim();
  if (getCats().includes(trimmed)) { alert('Categoria există deja.'); return; }
  openAddModal();
  const sel = document.getElementById('f-category');
  if (sel) {
    if (![...sel.options].find(o => o.value === trimmed)) {
      const opt = document.createElement('option');
      opt.value = trimmed; opt.textContent = trimmed;
      sel.insertBefore(opt, sel.lastElementChild);
    }
    sel.value = trimmed;
  }
}

function catOpts(cur) {
  return getCats().map(c=>`<option${c===cur?' selected':''}>${c}</option>`).join('');
}

let nextId = 303;
let filter='all', subfilter='all', search='', sortField='name', sortDir=1, selectedId=null;

function filteredData() {
  let d = [...partners];
  if (filter !== 'all') d = d.filter(p => p.category === filter);
  if (subfilter !== 'all') d = d.filter(p => (p.subcategory||'').split(',').map(s=>s.trim()).includes(subfilter));
  if (search) {
    const q = norm(search);
    d = d.filter(p =>
      norm(p.name).includes(q) ||
      norm(p.email).includes(q) ||
      norm(p.phone).includes(q) ||
      norm(p.website).includes(q) ||
      norm(p.notes).includes(q) ||
      norm(p.context).includes(q) ||
      (p.contacts||[]).some(c =>
        norm(c.name).includes(q) ||
        norm(c.phone).includes(q) ||
        norm(c.email).includes(q) ||
        norm(c.ielRelation).includes(q)
      )
    );
  }
  d.sort((a,b) => (a[sortField]||'').localeCompare(b[sortField]||'','ro') * sortDir);
  return d;
}

function sortBy(f) {
  if (sortField===f) sortDir*=-1; else { sortField=f; sortDir=1; }
  ['name','category'].forEach(x => document.getElementById('th-'+x)?.classList.toggle('sorted', x===sortField));
  render();
}

function starDisplay(r) {
  if (!r) return '<span style="color:#d6eef0;font-size:14px">☆☆☆☆☆</span>';
  return [1,2,3,4,5].map(i => `<span style="color:${r>=i?'#f0a500':'#d6eef0'};font-size:14px">★</span>`).join('');
}

function setRating(pid, val) {
  const p = partners.find(x=>x.id===pid); if(!p) return;
  p.rating = (p.rating===val) ? 0 : val; // click same star = clear
  renderDetail(p);
  render();
  triggerSave();
}

function renderSubTabs() {
  const bar = document.getElementById('subtabBar');
  if (filter === 'all') { bar.style.display = 'none'; bar.innerHTML = ''; return; }
  // collect distinct individual keywords from all subcategory strings
  const subs = [...new Set(
    partners.filter(p => p.category === filter && (p.subcategory||'').trim())
            .flatMap(p => p.subcategory.split(',').map(s=>s.trim()).filter(Boolean))
  )].sort((a,b) => a.localeCompare(b,'ro'));
  if (!subs.length) { bar.style.display = 'none'; bar.innerHTML = ''; return; }
  bar.style.display = 'block';
  bar.className = 'subtab-bar';
  bar.innerHTML = `<button class="subtab ${subfilter==='all'?'active':''}" data-sub="all">Toate</button>`
    + subs.map(s => `<button class="subtab ${subfilter===s?'active':''}" data-sub="${esc(s)}">${esc(s)}</button>`).join('');
  bar.querySelectorAll('.subtab').forEach(t => t.addEventListener('click', () => {
    subfilter = t.dataset.sub; renderSubTabs(); render();
  }));
}

function handleCatSelect(sel, id) {
  if (sel.value === '__new__') {
    const name = prompt('Nume categorie nouă:');
    if (name && name.trim()) {
      const trimmed = name.trim();
      if (!getCats().includes(trimmed)) {
        const opt = document.createElement('option');
        opt.value = trimmed; opt.textContent = trimmed;
        sel.insertBefore(opt, sel.lastElementChild); // before __new__
      }
      sel.value = trimmed;
    } else {
      sel.value = sel.options[0].value; // revert
    }
  }
}

let saveTimeout = null;

async function loadFromBackend() {
  showStatus('loading');
  try {
    const res = await fetch('/api/partners');
    if (!res.ok) throw new Error('load failed');
    const data = await res.json();
    if (data && Array.isArray(data.partners)) {
      partners = (data.partners || []).filter(p => p && p.id && p.name);
      nextId = partners.length ? Math.max(...partners.map(p=>p.id)) + 1 : 51;
    }
  } catch(e) {
    console.warn('Could not load from backend, using local data:', e);
  }
  hideStatus();
  render();
}

async function saveToBackend() {
  showStatus('saving');
  try {
    const res = await fetch('/api/partners', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ partners })
    });
    if (!res.ok) throw new Error('save failed');
    showStatus('saved');
    setTimeout(hideStatus, 2000);
  } catch(e) {
    showStatus('error');
    setTimeout(hideStatus, 3000);
    console.error('Save failed:', e);
  }
}

function triggerSave() {
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(saveToBackend, 800);
}

function showStatus(type) {
  const el = document.getElementById('syncStatus');
  el.className = 'sync-status ' + type;
  el.textContent = type === 'loading' ? '⏳ Se încarcă…' : type === 'saving' ? '💾 Se salvează…' : type === 'saved' ? '✓ Salvat' : '⚠ Eroare la salvare';
  el.style.display = 'inline-block';
}
function hideStatus() {
  document.getElementById('syncStatus').style.display = 'none';
}
