cat > ~/iel-partners/netlify.toml << 'EOF'
[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

  [functions.import]
    timeout = 26

  [functions.export]
    timeout = 30

[[redirects]]
  from = "/api/partners"
  to = "/.netlify/functions/partners"
  status = 200

[[redirects]]
  from = "/api/import"
  to = "/.netlify/functions/import"
  status = 200

[[redirects]]
  from = "/api/export"
  to = "/.netlify/functions/export"
  status = 200
EOF
